# Windows でテストと exe ビルドを行い、フォルダ一式をアーティファクトとして残す。
# 次のどちらかで、zip を GitHub Releases に添付する（Release が無ければ作る。あれば zip を差し替える）。
#   - v で始まるタグ（例：v1.0.0）を push する（タグと __version__ が一致している必要がある）
#   - Actions の画面で build-windows を手動実行し、release にチェックを入れる
#     （タグ v<__version__> を、実行したブランチの最新コミットに作る）
name: build-windows

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "v<__version__> の Release を作って（更新して）zip を添付する"
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # Releases の作成に必要
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Build exe
        run: pyinstaller --noconfirm --clean INA226_BatteryChecker.spec
      - name: Check exe icon
        run: python tools/check_exe_icon.py dist/INA226_BatteryChecker/INA226_BatteryChecker.exe assets/app_icon.ico
      - name: Zip
        shell: pwsh
        run: |
          $ver = python -c "import battery_checker as m; print(m.__version__)"
          $zip = "INA226_BatteryChecker_v$ver.zip"
          Compress-Archive -Force -Path dist\INA226_BatteryChecker -DestinationPath $zip
          "VERSION=$ver" >> $env:GITHUB_ENV
          "ZIP=$zip" >> $env:GITHUB_ENV
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: INA226_BatteryChecker-windows
          path: dist/INA226_BatteryChecker

      # ---- ここから Release を作るときだけ（タグの push、または手動実行で release を選んだとき） ----
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "v$env:VERSION") {
            Write-Error "タグ ${{ github.ref_name }} と battery_checker/__init__.py の __version__ ($env:VERSION) が一致しません"
            exit 1
          }
      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.ref }}".StartsWith("refs/tags/v")) { "${{ github.ref_name }}" } else { "v$env:VERSION" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            # タグが無ければ、このコミットに作る
            gh release create $tag --target "${{ github.sha }}" --title "INA226_BatteryChecker $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $tag $env:ZIP --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "Release: $tag ($env:ZIP)" >> $env:GITHUB_STEP_SUMMARY
